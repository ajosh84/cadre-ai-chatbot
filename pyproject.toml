[tool.poetry]
name = "chatbot"
version = "0.1.0"
description = ""
authors = ["Allan Joshua <allanjoshua1984@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.52.4"}
httpx = "^0.28.1"
python-dotenv = "^1.2.3"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-html = "^4.2.0"

[tool.pytest.ini_options]
# Repo root isn't on sys.path by default under pytest's import mode (no tests/__init__.py),
# so `from backend...` imports fail without this. Matches how uvicorn is run — from the root.
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
