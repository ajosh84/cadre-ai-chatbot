<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadre AI Support</title>
  <style>
    :root {
      --navy: #14213d;
      --navy-dark: #0c162b;
      --border: #dfe3ea;
      --bg: #f5f6f8;
      --text: #1c2331;
      --muted: #6b7280;
      --user-bg: #14213d;
      --user-text: #ffffff;
      --assistant-bg: #ffffff;
      --assistant-text: #1c2331;
      --error-bg: #fdf1f1;
      --error-border: #e3b3b3;
      --error-text: #9b2c2c;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
        sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .chat-widget {
      width: 100%;
      max-width: 560px;
      height: 680px;
      max-height: 90vh;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(20, 33, 61, 0.08);
    }

    .chat-header {
      background: var(--navy);
      color: #ffffff;
      padding: 16px 20px;
      flex-shrink: 0;
    }

    .chat-header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .chat-header p {
      margin: 2px 0 0;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .message-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message-row.user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 2px;
    }

    .message-row.assistant .bubble {
      background: var(--assistant-bg);
      color: var(--assistant-text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    .message-row.status .bubble {
      background: transparent;
      border: none;
      color: var(--muted);
      font-style: italic;
      padding: 4px 2px;
    }

    .message-row.error .bubble {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .typing-dot {
      display: inline-block;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .input-bar {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: #ffffff;
    }

    #message-input {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      max-height: 120px;
      line-height: 1.4;
      transition: border-color 0.15s ease;
    }

    #message-input:focus {
      outline: none;
      border-color: var(--navy);
    }

    #send-button {
      flex-shrink: 0;
      background: var(--navy);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    #send-button:hover:not(:disabled) {
      background: var(--navy-dark);
    }

    #send-button:disabled {
      background: #a9afbc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-widget">
    <div class="chat-header">
      <h1>Cadre AI Support</h1>
      <p>Ask us about our services, engagements, or how to get started.</p>
    </div>

    <div class="message-list" id="message-list" aria-live="polite"></div>

    <div class="input-bar">
      <textarea
        id="message-input"
        rows="1"
        placeholder="Type your message..."
        aria-label="Message"
      ></textarea>
      <button id="send-button" disabled>Send</button>
    </div>
  </div>

  <script>
    (function () {
      var messageList = document.getElementById("message-list");
      var input = document.getElementById("message-input");
      var sendButton = document.getElementById("send-button");

      // Full conversation history as {role, content} objects.
      var conversation = [];
      var requestInFlight = false;
      var typingRowEl = null;

      function scrollToBottom() {
        messageList.scrollTop = messageList.scrollHeight;
      }

      function renderMessage(role, content) {
        var row = document.createElement("div");
        row.className = "message-row " + role;

        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = content;

        row.appendChild(bubble);
        messageList.appendChild(row);
        scrollToBottom();
        return row;
      }

      function showTypingIndicator() {
        var row = document.createElement("div");
        row.className = "message-row status assistant";

        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = 'Cadre AI is typing<span class="typing-dot">...</span>';

        row.appendChild(bubble);
        messageList.appendChild(row);
        scrollToBottom();
        typingRowEl = row;
      }

      function removeTypingIndicator() {
        if (typingRowEl && typingRowEl.parentNode) {
          typingRowEl.parentNode.removeChild(typingRowEl);
        }
        typingRowEl = null;
      }

      function showError(text) {
        var row = document.createElement("div");
        row.className = "message-row error";

        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        row.appendChild(bubble);
        messageList.appendChild(row);
        scrollToBottom();
      }

      function updateSendButtonState() {
        var hasText = input.value.trim().length > 0;
        sendButton.disabled = !hasText || requestInFlight;
      }

      function setInputEnabled(enabled) {
        requestInFlight = !enabled;
        input.disabled = !enabled;
        updateSendButtonState();
      }

      function autoResizeInput() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
      }

      function sendMessage() {
        var text = input.value.trim();
        if (!text || requestInFlight) {
          return;
        }

        // History is the conversation BEFORE this new message.
        var historyForRequest = conversation.slice();

        conversation.push({ role: "user", content: text });
        renderMessage("user", text);

        input.value = "";
        autoResizeInput();
        setInputEnabled(false);

        showTypingIndicator();

        fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: historyForRequest }),
        })
          .then(function (res) {
            if (!res.ok) {
              throw new Error("Non-200 response: " + res.status);
            }
            return res.json();
          })
          .then(function (data) {
            removeTypingIndicator();
            var reply = data && typeof data.response === "string"
              ? data.response
              : "Sorry, something went wrong. Please try again.";
            conversation.push({ role: "assistant", content: reply });
            renderMessage("assistant", reply);
          })
          .catch(function () {
            removeTypingIndicator();
            showError("Something went wrong. Please try again.");
            // Do not add anything to `conversation` for the failed exchange.
          })
          .finally(function () {
            setInputEnabled(true);
            input.focus();
          });
      }

      sendButton.addEventListener("click", sendMessage);

      input.addEventListener("input", function () {
        updateSendButtonState();
        autoResizeInput();
      });

      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      updateSendButtonState();
    })();
  </script>
</body>
</html>
